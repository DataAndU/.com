# /etc/nginx/sites-available/pontreol  — Cloudflare -> nginx -> Next (:3000) + FastAPI (:8080)
# FastAPI listens on 127.0.0.1; Next on :3000 is blocked by ufw; PostgreSQL is never exposed.
# Next already sends immutable Cache-Control for /_next/static.

upstream pontreol_web { server 127.0.0.1:3000; keepalive 32; }
upstream pontreol_api { server 127.0.0.1:8080; keepalive 32; }

# Restore the real client IP from Cloudflare (keep this list current:
# https://www.cloudflare.com/ips/). Only trust CF-Connecting-IP from Cloudflare.
include /etc/nginx/snippets/cloudflare-realip.conf;

server {
    listen 80;
    listen [::]:80;
    server_name pontreol.com www.pontreol.com;
    return 301 https://pontreol.com$request_uri;
}

server {
    # Compatible with nginx 1.18+ (Ubuntu 22.04). On nginx >= 1.25 you may use `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pontreol.com;
    ssl_certificate     /etc/ssl/cloudflare/pontreol.pem;      # Cloudflare Origin Certificate
    ssl_certificate_key /etc/ssl/cloudflare/pontreol.key;
    return 301 https://pontreol.com$request_uri;
}

server {
    # Compatible with nginx 1.18+ (Ubuntu 22.04). On nginx >= 1.25 you may use `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pontreol.com;                                  # single canonical host

    ssl_certificate     /etc/ssl/cloudflare/pontreol.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pontreol.key;

    # API bodies are small JSON; photos upload directly to GCS via signed URLs.
    client_max_body_size 5m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location /api/ {
        proxy_pass http://pontreol_api;
        # The Clerk proxy streams Clerk's responses verbatim; do not buffer-modify.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://pontreol_web;
    }
}
